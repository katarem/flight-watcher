<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Vigila precios de vuelos y avisa de los chollos." />
    <title>Flight Watcher</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Tema antes del primer pintado (sin parpadeo): preferencia guardada o la del sistema.
      (function () {
        try {
          var t = localStorage.getItem('fw-theme')
          var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
