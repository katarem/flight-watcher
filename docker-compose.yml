services:
  flight-watcher:
    # Imagen publicada por el CI en ghcr.io; `docker compose up -d --build` la construye en local.
    image: ghcr.io/katarem/flight-watcher:${FW_VERSION:-latest}
    build: .
    container_name: flight-watcher
    restart: unless-stopped
    init: true            # evita procesos zombi de Chromium
    shm_size: "1gb"       # Chromium necesita memoria compartida
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Madrid
      PANEL_USER: ${PANEL_USER:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      PROVIDER_SCRIPTS: ${PROVIDER_SCRIPTS:-1}
      # Base de datos: sqlite (archivo en la carpeta de datos), postgres, mysql o mariadb.
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-flight_watcher}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      # Carpeta del host con la BD SQLite y los archivos de diagnóstico.
      - ${DATA_PATH:-./data}:/data
