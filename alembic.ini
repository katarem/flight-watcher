# Solo para la CLI de Alembic (crear revisiones a mano). La app aplica las migraciones
# sola al arrancar (db.init) sin leer este archivo. Usa las mismas variables DB_* que la app.
#   alembic revision --autogenerate -m "descripción" --rev-id 0002
#   alembic upgrade head
#   alembic check
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
