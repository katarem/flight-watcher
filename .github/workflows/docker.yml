name: CI/CD

# - Pull request y push a main: pasa los tests (API y panel) y construye la imagen (en main también la publica como `latest`).
# - Etiqueta vX.Y.Z: publica la imagen versionada (X.Y.Z, X.Y y latest) en ghcr.io.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt httpx
      - name: Esquema y migraciones al día
        run: |
          export DATA_DIR="$(mktemp -d)"
          python -c "from app import db; db.init()"
          alembic check
      - name: Test de humo (sin red)
        run: python -m tests.smoke_test
      - name: Migraciones sobre una BD con datos
        run: python -m tests.migration_test
      - name: La etiqueta coincide con la versión del código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code="$(python -c 'from app import __version__; print(__version__)')"
          test "v${code}" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con app/__init__.py (${code})"; exit 1; }

  panel:
    # Panel React: lint, tipos, tests unitarios, build y pruebas en navegador (con axe) contra la app real.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          npm ci
          pip install -r ../requirements.txt
      - name: Lint y tipos
        run: |
          npm run lint
          npm run typecheck
      - name: Tests unitarios
        run: npm test
      - name: Build
        run: npm run build
      - name: Pruebas en navegador (Playwright + axe)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    needs: [test, panel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: version
        run: echo "value=$(python3 -c 'from app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
