{# Avatar redondo: la imagen subida o, si no hay, las iniciales sobre un color derivado del id. #}
{% macro avatar(u, size='') %}
{% if u.avatar %}<img class="avatar {{ size }}" src="/avatars/{{ u.avatar }}" alt="" loading="lazy">
{%- else %}<span class="avatar {{ size }}" style="--h: {{ ((u.id or 0) * 47) % 360 }}" aria-hidden="true">{{ (u.display_name or u.username or '?')[:1]|upper }}</span>{% endif %}
{% endmacro %}
