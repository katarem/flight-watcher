{% extends "base.html" %}
{% block title %}Nuevo canal{% endblock %}
{% block content %}
<h1>Nuevo canal de aviso{% if owner.id != me.id %} · @{{ owner.username }}{% endif %}</h1>
<section class="card">
  <p>¿De qué tipo?</p>
  <div class="actions">
    {% for key, k in kinds.items() %}
    <a class="btn" href="{{ new_url }}?kind={{ key }}">{{ k.label }}</a>
    {% endfor %}
    <a class="btn ghost" href="{{ back }}">Cancelar</a>
  </div>
</section>
{% endblock %}
